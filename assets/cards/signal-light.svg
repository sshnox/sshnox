<svg xmlns="http://www.w3.org/2000/svg" width="436" height="176" viewBox="0 0 436 176" role="img" aria-label="Signal-e2e-chat blueprint card">
  <defs>
    <style>
      @keyframes packet { to { stroke-dashoffset: -24; } }
      .pkt { stroke-dasharray: 5 7; animation: packet 1.5s linear infinite; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="435" height="175" rx="14" fill="#FCFBF7" stroke="#D6D3C9"/>
  <rect x="18" y="16" width="58" height="20" rx="5" fill="#E0F2FE" stroke="#BAE6FD"/>
  <text x="47" y="29.5" text-anchor="middle" fill="#0369A1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">PROTO</text>
  <text x="418" y="29.5" text-anchor="end" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">TypeScript · E2EE ↗</text>

  <text x="18" y="59" fill="#18181B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Signal-e2e-chat</text>
  <text x="18" y="79" fill="#52525B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Local E2EE messaging with relay, dual clients &amp; ratchet.</text>

  <rect x="18" y="96" width="400" height="62" rx="9" fill="#FFFFFF" stroke="#E4E2DA"/>
  <line x1="108" y1="127" x2="328" y2="127" stroke="#E4E2DA" stroke-width="2"/>
  <line class="pkt" x1="108" y1="127" x2="328" y2="127" stroke="#0284C7" stroke-width="2"/>

  <rect x="30" y="112" width="78" height="30" rx="6" fill="#F8FAFC" stroke="#0284C7"/>
  <text x="69" y="131" text-anchor="middle" fill="#18181B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">CLIENT A</text>

  <rect x="166" y="110" width="104" height="34" rx="6" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="218" y="125" text-anchor="middle" fill="#854D0E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700">RATCHET</text>
  <text x="218" y="138" text-anchor="middle" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5">RELAY CIPHER</text>

  <rect x="328" y="112" width="78" height="30" rx="6" fill="#F8FAFC" stroke="#16A34A"/>
  <text x="367" y="131" text-anchor="middle" fill="#18181B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">CLIENT B</text>
