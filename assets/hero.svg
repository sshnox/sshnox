<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Shoaib Shah — Build, learn, contribute</title>
<desc id="desc">A restrained hand-drawn editorial banner on a warm paper background with an ink desk illustration and a small coral accent.</desc>
<defs>
  <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="0.8" fill="#1E293B" opacity="0.055"/><circle cx="17" cy="15" r="0.55" fill="#1E293B" opacity="0.045"/></pattern>
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/></filter>
</defs>
<rect width="1400" height="430" rx="22" fill="#F5F1E8"/>
<rect width="1400" height="430" rx="22" fill="url(#paper)"/>
<!-- loose editorial frame -->
<path d="M38 40C270 32 520 48 700 38C930 26 1134 47 1362 37" stroke="#1E293B" stroke-width="2" opacity="0.7" filter="url(#rough)"/>
<path d="M42 394C290 401 470 386 698 397C950 407 1148 385 1357 395" stroke="#1E293B" stroke-width="2" opacity="0.6" filter="url(#rough)"/>
<path d="M44 48C34 160 52 278 42 384" stroke="#1E293B" stroke-width="1.7" opacity="0.55" filter="url(#rough)"/>
<path d="M1358 46C1368 170 1348 280 1360 386" stroke="#1E293B" stroke-width="1.7" opacity="0.55" filter="url(#rough)"/>
<!-- left copy -->
<text x="100" y="103" fill="#64748B" font-family="monospace" font-size="14" letter-spacing="3">PROFILE NOTE / 01</text>
<text x="96" y="190" fill="#111827" font-family="Georgia,Times New Roman,serif" font-size="67" font-weight="700">Shoaib Shah</text>
<path d="M99 208C240 216 362 199 498 209" stroke="#F06B55" stroke-width="5" stroke-linecap="round" opacity="0.85" filter="url(#rough)"/>
<text x="101" y="249" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Builder of useful software, curious systems,</text>
<text x="101" y="278" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">and things worth learning in public.</text>
<text x="101" y="339" fill="#64748B" font-family="monospace" font-size="14">DATA  /  AI  /  AUTOMATION  /  OPEN SOURCE</text>
<!-- right hand-drawn desk / monitor -->
