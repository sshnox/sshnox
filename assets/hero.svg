  <path d="M750 337C864 329 1053 331 1165 340" stroke-width="3"/>
  <path d="M767 339L736 367M1148 341L1178 368" stroke-width="3"/>
  <path d="M846 176C864 164 879 163 893 176C908 190 924 178 939 166C955 153 969 182 987 176C1005 169 1019 152 1037 167C1053 181 1064 169 1081 160" stroke-width="2.2"/>
