<svg xmlns="http://www.w3.org/2000/svg" width="900" height="268" viewBox="0 0 900 268" role="img" aria-label="sshnox live engineering telemetry console">
  <defs>
    <style>
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes draw { from { stroke-dashoffset: 360; } to { stroke-dashoffset: 0; } }
      .bar { transform-origin: 356px 0px; animation: grow 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .spark { stroke-dasharray: 360; animation: draw 1.6s ease-out forwards; }
    </style>
    <linearGradient id="spark-fill-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="267" rx="14" fill="#FCFBF7" stroke="#D6D3C9"/>
  <path d="M 1 14 Q 1 1 14 1 L 886 1 Q 899 1 899 14 L 899 36 L 1 36 Z" fill="#F2EFE6"/>
  <line x1="1" y1="36" x2="899" y2="36" stroke="#D6D3C9"/>

  <circle cx="20" cy="18.5" r="4.5" fill="#EF4444" fill-opacity="0.8"/>
